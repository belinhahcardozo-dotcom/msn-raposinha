<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MSN Messenger — Bruxinha & Raposinha</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      background:
        linear-gradient(rgba(255,255,255,.35), rgba(255,255,255,.35)),
        #d9e8f5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    button,
    input {
      font-family: Tahoma, Arial, sans-serif;
    }

    /* LOGIN */

    #loginScreen {
      width: 100%;
      max-width: 360px;
      background: #f1f1f1;
      border: 1px solid #55738c;
      border-radius: 8px 8px 4px 4px;
      box-shadow: 0 4px 18px rgba(0,0,0,.35);
      overflow: hidden;
    }

    .login-title {
      height: 38px;
      background: linear-gradient(#5fa7e2, #1766a5);
      color: white;
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-size: 13px;
      font-weight: bold;
      text-shadow: 1px 1px 1px #24506e;
    }

    .msn-logo {
      width: 21px;
      height: 21px;
      margin-right: 7px;
      border-radius: 50%;
      background: #8fd14f;
      border: 2px solid white;
      position: relative;
    }

    .msn-logo::after {
      content: "☁";
      position: absolute;
      color: white;
      font-size: 12px;
      left: 2px;
      top: -1px;
    }

    .login-content {
      padding: 25px 22px;
      text-align: center;
      background: linear-gradient(#fff, #e7eef4);
    }

    .login-avatar {
      width: 76px;
      height: 76px;
      margin: 0 auto 12px;
      border: 2px solid #9ab3c7;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      box-shadow: inset 0 0 5px rgba(0,0,0,.2);
    }

    .login-title-text {
      color: #174f7c;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .login-subtitle {
      color: #666;
      font-size: 11px;
      margin-bottom: 20px;
    }

    .login-content input {
      display: block;
      width: 100%;
      height: 35px;
      border: 1px solid #999;
      border-radius: 3px;
      padding: 6px 9px;
      margin-bottom: 9px;
      font-size: 12px;
      background: white;
    }

    .login-button {
      width: 100%;
      height: 34px;
      margin-top: 4px;
      border: 1px solid #47799d;
      background: linear-gradient(#e9f7ff, #a9d7f1);
      color: #174f72;
      border-radius: 3px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-button:active {
      background: #8ec5e5;
    }

    #loginError {
      display: none;
      margin-top: 12px;
      padding: 7px;
      background: #ffe8e8;
      border: 1px solid #e0aaaa;
      color: #a33;
      font-size: 10px;
      text-align: left;
      border-radius: 3px;
    }

    .login-footer {
      text-align: center;
      color: #777;
      font-size: 9px;
      padding: 7px;
      background: #eee;
    }

    /* MSN */

    #messenger {
      display: none;
      width: 100%;
      max-width: 390px;
      min-height: 650px;
      background: #f1f1f1;
      border: 1px solid #55738c;
      border-radius: 8px 8px 4px 4px;
      box-shadow: 0 4px 18px rgba(0,0,0,.35);
      overflow: hidden;
      position: relative;
    }

    .titlebar {
      height: 32px;
      background: linear-gradient(#5fa7e2, #1766a5);
      color: white;
      display: flex;
      align-items: center;
      padding: 0 9px;
      font-size: 13px;
      font-weight: bold;
      text-shadow: 1px 1px 1px #24506e;
    }

    .window-buttons {
      margin-left: auto;
      display: flex;
      gap: 3px;
    }

    .window-button {
      width: 22px;
      height: 20px;
      background: rgba(255,255,255,.2);
      border: 1px solid rgba(255,255,255,.5);
      color: white;
      text-align: center;
      line-height: 18px;
      border-radius: 2px;
      cursor: pointer;
    }

    .profile {
      background: linear-gradient(#fff, #e7eef4);
      padding: 14px;
      display: flex;
      border-bottom: 1px solid #b5c4d0;
    }

    .avatar {
      width: 64px;
      height: 64px;
      border: 2px solid #9ab3c7;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
      margin-right: 12px;
      box-shadow: inset 0 0 5px rgba(0,0,0,.2);
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar img,
    .contact-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .name {
      font-size: 17px;
      color: #174f7c;
      font-weight: bold;
      margin-top: 4px;
    }

    .status {
      color: #278313;
      font-size: 12px;
      margin-top: 5px;
    }

    .personal-message {
      color: #555;
      font-size: 11px;
      margin-top: 8px;
      font-style: italic;
    }

    .logout {
      margin-left: auto;
      margin-top: 3px;
      height: 24px;
      padding: 0 7px;
      border: 1px solid #aaa;
      background: linear-gradient(#fff, #ddd);
      color: #555;
      border-radius: 3px;
      font-size: 9px;
      cursor: pointer;
    }

    .contact-area {
      background: #fff;
      padding: 9px;
      border-bottom: 1px solid #c4c4c4;
    }

    .contact-title {
      font-size: 11px;
      color: #666;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .contact {
      display: flex;
      align-items: center;
      padding: 7px;
      background: linear-gradient(#fff, #eaf4fb);
      border: 1px solid #b9d1e2;
      border-radius: 3px;
    }

    .contact-avatar {
      width: 38px;
      height: 38px;
      background: #f2e8dc;
      border: 1px solid #aaa;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-right: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .contact-name {
      color: #14527d;
      font-weight: bold;
      font-size: 13px;
    }

    .online {
      color: #248617;
      font-size: 10px;
    }

    .chat {
      background: white;
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      font-size: 12px;
    }

    .message {
      margin-bottom: 10px;
    }

    .message .sender {
      font-weight: bold;
      color: #165c91;
    }

    .message.mine .sender {
      color: #7b3fa1;
    }

    .message .text {
      margin-top: 2px;
      color: #222;
      word-wrap: break-word;
    }

    .message-time {
      color: #999;
      font-size: 8px;
      margin-left: 5px;
      font-weight: normal;
    }

    .typing {
      display: none;
      font-size: 10px;
      color: #777;
      font-style: italic;
      padding: 3px 10px;
      background: #f3f3f3;
    }

    .input-area {
      background: linear-gradient(#f7f7f7, #dedede);
      border-top: 1px solid #aaa;
      padding: 8px;
      display: flex;
      gap: 5px;
    }

    #messageInput {
      flex: 1;
      height: 32px;
      border: 1px solid #999;
      border-radius: 2px;
      padding: 5px 8px;
      font-size: 12px;
    }

    .send-button {
      border: 1px solid #47799d;
      background: linear-gradient(#e9f7ff, #a9d7f1);
      color: #174f72;
      border-radius: 3px;
      padding: 0 10px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    .toolbar {
      display: flex;
      gap: 5px;
      padding: 5px 8px;
      background: #eeeeee;
      border-top: 1px solid #ccc;
    }

    .toolbar button {
      height: 25px;
      padding: 0 8px;
      border: 1px solid #47799d;
      background: linear-gradient(#e9f7ff, #a9d7f1);
      color: #174f72;
      border-radius: 3px;
      cursor: pointer;
    }

    .nudge {
      background: linear-gradient(#fff4d6, #f0c765) !important;
      border-color: #b28b30 !important;
      color: #694f0b !important;
    }

    .footer {
      text-align: center;
      color: #777;
      font-size: 9px;
      padding: 5px;
      background: #eee;
    }

    @keyframes shake {
      0%   { transform: translate(0,0) rotate(0); }
      15%  { transform: translate(-8px,2px) rotate(-1deg); }
      30%  { transform: translate(8px,-2px) rotate(1deg); }
      45%  { transform: translate(-8px,-2px) rotate(-1deg); }
      60%  { transform: translate(8px,2px) rotate(1deg); }
      75%  { transform: translate(-5px,0) rotate(0); }
      100% { transform: translate(0,0) rotate(0); }
    }

    .shake {
      animation: shake .45s ease-in-out 2;
    }

    @media (max-width: 420px) {
      #messenger {
        min-height: calc(100vh - 30px);
      }

      .chat {
        height: 34vh;
        min-height: 220px;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->

  <div id="loginScreen">

    <div class="login-title">
      <div class="msn-logo"></div>
      MSN Messenger
    </div>

    <div class="login-content">

      <div class="login-avatar">
        ☾
      </div>

      <div class="login-title-text">
        Entrar no MSN
      </div>

      <div class="login-subtitle">
        Entre para conversar com sua raposinha 💜
      </div>

      <input
        id="emailInput"
        type="email"
        placeholder="E-mail"
        autocomplete="email"
      >

      <input
        id="passwordInput"
        type="password"
        placeholder="Senha"
        autocomplete="current-password"
      >

      <button
        class="login-button"
        id="loginButton"
        onclick="login()"
      >
        Entrar
      </button>

      <div id="loginError"></div>

    </div>

    <div class="login-footer">
      MSN Messenger • Bruxinha & Raposinha
    </div>

  </div>


  <!-- MSN -->

  <div class="messenger" id="messenger">

    <div class="titlebar">

      <div class="msn-logo"></div>

      MSN Messenger

      <div class="window-buttons">

        <div
          class="window-button"
          onclick="logout()"
          title="Sair"
        >
          ×
        </div>

      </div>

    </div>


    <div class="profile">

      <div class="avatar" id="myAvatar">
        ☾
      </div>

      <div>

        <div class="name" id="myName">
          Carregando...
        </div>

        <div class="status" id="myStatus">
          ● Online
        </div>

        <div class="personal-message" id="myMessage">
          "..."
        </div>

      </div>

    </div>


    <div class="contact-area">

      <div class="contact-title">
        ONLINE — 1
      </div>

      <div class="contact">

        <div class="contact-avatar" id="contactAvatar">
          🦊
        </div>

        <div>

          <div class="contact-name" id="contactName">
            Raposinha
          </div>

          <div class="online" id="contactStatus">
            ● Online
          </div>

        </div>

      </div>

    </div>


    <div class="chat" id="chat"></div>


    <div class="typing" id="typing">
      Raposinha está digitando...
    </div>


    <div class="toolbar">

      <button onclick="addEmoji('😊')">😊</button>
      <button onclick="addEmoji('😂')">😂</button>
      <button onclick="addEmoji('🥺')">🥺</button>
      <button onclick="addEmoji('❤️')">❤️</button>

      <button
        class="nudge"
        onclick="nudge()"
      >
        📳 Nudge
      </button>

    </div>


    <div class="input-area">

      <input
        id="messageInput"
        type="text"
        placeholder="Digite uma mensagem..."
        autocomplete="off"
        onkeydown="if(event.key === 'Enter') sendMessage()"
      >

      <button
        class="send-button"
        onclick="sendMessage()"
      >
        Enviar
      </button>

    </div>


    <div class="footer">
      MSN Messenger • Bruxinha & Raposinha
    </div>

  </div>


  <script>

    /* =========================================================
       SUPABASE
       ========================================================= */

    const SUPABASE_URL =
      "https://ojoecmioovwmirdvedzr.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_1_QzlhlMc2HS_aNkzbJqRg_SgtJzfS3";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================================================
       ELEMENTOS
       ========================================================= */

    const loginScreen =
      document.getElementById("loginScreen");

    const messenger =
      document.getElementById("messenger");

    const emailInput =
      document.getElementById("emailInput");

    const passwordInput =
      document.getElementById("passwordInput");

    const loginButton =
      document.getElementById("loginButton");

    const loginError =
      document.getElementById("loginError");

    const chat =
      document.getElementById("chat");

    const input =
      document.getElementById("messageInput");


    let currentUser = null;
    let currentProfile = null;
    let realtimeChannel = null;


    /* =========================================================
       LOGIN
       ========================================================= */

    async function login() {

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;

      hideLoginError();

      if (!email || !password) {

        showLoginError(
          "Digite seu e-mail e sua senha."
        );

        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "Entrando...";

      try {

        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) {
          throw error;
        }

        currentUser = data.user;

        await startMessenger();

      } catch (error) {

        console.error(error);

        showLoginError(
          getFriendlyAuthError(error)
        );

      } finally {

        loginButton.disabled = false;
        loginButton.textContent = "Entrar";

      }
    }


    function getFriendlyAuthError(error) {

      const message =
        String(error?.message || "").toLowerCase();

      if (
        message.includes("invalid login") ||
        message.includes("invalid credentials")
      ) {
        return "E-mail ou senha incorretos.";
      }

      if (
        message.includes("email not confirmed")
      ) {
        return "Esse e-mail ainda não foi confirmado no Supabase.";
      }

      return error?.message ||
        "Não foi possível entrar.";
    }


    function showLoginError(message) {

      loginError.textContent = message;

      loginError.style.display = "block";
    }


    function hideLoginError() {

      loginError.textContent = "";

      loginError.style.display = "none";
    }


    /* =========================================================
       INICIALIZAÇÃO
       ========================================================= */

    async function checkSession() {

      try {

        const {
          data,
          error
        } = await supabaseClient.auth.getSession();

        if (error) {
          throw error;
        }

        if (data.session?.user) {

          currentUser =
            data.session.user;

          await startMessenger();

        }

      } catch (error) {

        console.error(
          "Erro ao verificar sessão:",
          error
        );

      }
    }


    supabaseClient.auth.onAuthStateChange(
      async (event, session) => {

        if (
          event === "SIGNED_IN" &&
          session?.user
        ) {

          currentUser = session.user;

        }

        if (event === "SIGNED_OUT") {

          currentUser = null;
          currentProfile = null;

          if (realtimeChannel) {

            await supabaseClient.removeChannel(
              realtimeChannel
            );

            realtimeChannel = null;

          }

          messenger.style.display = "none";
          loginScreen.style.display = "block";

          chat.innerHTML = "";

        }

      }
    );


    /* =========================================================
       ABRIR MSN
       ========================================================= */

    async function startMessenger() {

      if (!currentUser) return;

      loginScreen.style.display = "none";
      messenger.style.display = "block";

      await loadProfile();
      await loadMessages();
      subscribeToMessages();

      input.focus();
    }


    /* =========================================================
       PROFILE
       ========================================================= */

    async function loadProfile() {

      const {
        data,
        error
      } = await supabaseClient
        .from("profiles")
        .select(
          "id, username, status, personal_message, avatar_url"
        )
        .eq("id", currentUser.id)
        .maybeSingle();

      if (error) {

        console.error(
          "Erro ao carregar perfil:",
          error
        );

        return;

      }

      currentProfile = data;

      if (!data) {

        updateDefaultProfile();

        return;

      }

      document.getElementById("myName")
        .textContent =
          data.username ||
          getFallbackName();

      document.getElementById("myStatus")
        .textContent =
          "● " +
          (data.status || "Online");

      document.getElementById("myMessage")
        .textContent =
          data.personal_message
            ? `"${data.personal_message}"`
            : "";

      if (data.avatar_url) {

        setAvatar(
          document.getElementById("myAvatar"),
          data.avatar_url
        );

      } else {

        document.getElementById("myAvatar")
          .textContent =
            getFallbackAvatar();

      }

      await loadContact();

    }


    function updateDefaultProfile() {

      document.getElementById("myName")
        .textContent =
          getFallbackName();

      document.getElementById("myStatus")
        .textContent =
          "● Online";

      document.getElementById("myMessage")
        .textContent =
          '"Esperando minha raposinha..."';

      document.getElementById("myAvatar")
        .textContent =
          getFallbackAvatar();

    }


    function getFallbackName() {

      if (!currentUser) {
        return "Bruxinha";
      }

      const email =
        currentUser.email?.toLowerCase();

      if (
        email ===
        "andressa.verissimo.g@icloud.com"
      ) {
        return "Raposinha";
      }

      return "Bruxinha";
    }


    function getFallbackAvatar() {

      if (!currentUser) {
        return "☾";
      }

      const email =
        currentUser.email?.toLowerCase();

      if (
        email ===
        "andressa.verissimo.g@icloud.com"
      ) {
        return "🦊";
      }

      return "☾";
    }


    async function loadContact() {

      const otherEmail =
        currentUser.email?.toLowerCase() ===
        "belinhahcardozoalm@gmail.com"
          ? "andressa.verissimo.g@icloud.com"
          : "belinhahcardozoalm@gmail.com";

      const {
        data,
        error
      } = await supabaseClient
        .from("profiles")
        .select(
          "id, username, status, personal_message, avatar_url"
        )
        .eq(
          "id",
          await getOtherUserId(otherEmail)
        )
        .maybeSingle();

      if (error) {

        console.warn(
          "Não foi possível carregar o contato:",
          error
        );

        return;

      }

      if (!data) {

        document.getElementById("contactName")
          .textContent =
            otherEmail ===
            "andressa.verissimo.g@icloud.com"
              ? "Raposinha"
              : "Bruxinha";

        document.getElementById("contactStatus")
          .textContent =
            "● Offline";

        return;

      }

      document.getElementById("contactName")
        .textContent =
          data.username ||
          (
            otherEmail ===
            "andressa.verissimo.g@icloud.com"
              ? "Raposinha"
              : "Bruxinha"
          );

      document.getElementById("contactStatus")
        .textContent =
          "● " +
          (data.status || "Online");

      if (data.avatar_url) {

        setAvatar(
          document.getElementById("contactAvatar"),
          data.avatar_url
        );

      } else {

        document.getElementById("contactAvatar")
          .textContent =
            otherEmail ===
            "andressa.verissimo.g@icloud.com"
              ? "🦊"
              : "☾";

      }

    }


    async function getOtherUserId(email) {

      const {
        data
      } = await supabaseClient
        .from("profiles")
        .select("id")
        .eq("id", currentUser.id)
        .maybeSingle();

      /*
        A tabela profiles usa o id do usuário.
        O cliente não consegue consultar auth.users
        diretamente por segurança.

        O contato continuará com o fallback visual
        caso ainda não exista uma linha correspondente.
      */

      return data?.id || null;
    }


    function setAvatar(element, url) {

      element.innerHTML = "";

      const img =
        document.createElement("img");

      img.src = url;

      img.alt = "Avatar";

      img.onerror = () => {

        element.textContent =
          getFallbackAvatar();

      };

      element.appendChild(img);
    }


    /* =========================================================
       MESSAGES
       ========================================================= */

    async function loadMessages() {

      chat.innerHTML = "";

      const {
        data,
        error
      } = await supabaseClient
        .from("messages")
        .select(
          "id, sender, message, created_at"
        )
        .order(
          "created_at",
          {
            ascending: true
          }
        );

      if (error) {

        console.error(
          "Erro ao carregar mensagens:",
          error
        );

        addSystemMessage(
          "Não foi possível carregar as mensagens."
        );

        return;

      }

      if (!data || data.length === 0) {

        addSystemMessage(
          "Nenhuma mensagem ainda. Mande um oi! 💜"
        );

        return;

      }

      data.forEach(
        renderMessage
      );

      scrollChat();

    }


    function renderMessage(row) {

      if (!row) return;

      const mine =
        row.sender?.toLowerCase() ===
        currentUser?.email?.toLowerCase();

      const message =
        document.createElement("div");

      message.className =
        mine
          ? "message mine"
          : "message";

      const senderName =
        getNameFromEmail(row.sender);

      const time =
        row.created_at
          ? formatTime(row.created_at)
          : "";

      message.innerHTML = `
        <div class="sender">
          ${escapeHTML(senderName)}
          <span class="message-time">
            ${escapeHTML(time)}
          </span>
        </div>

        <div class="text">
          ${escapeHTML(row.message || "")}
        </div>
      `;

      chat.appendChild(message);

      scrollChat();

    }


    function addSystemMessage(text) {

      const message =
        document.createElement("div");

      message.className =
        "message";

      message.innerHTML = `
        <div class="sender">
          MSN Messenger
        </div>

        <div class="text">
          ${escapeHTML(text)}
        </div>
      `;

      chat.appendChild(message);

    }


    function getNameFromEmail(email) {

      if (!email) {
        return "Usuário";
      }

      const normalized =
        email.toLowerCase();

      if (
        normalized ===
        "belinhahcardozoalm@gmail.com"
      ) {
        return "☾ Bruxinha";
      }

      if (
        normalized ===
        "andressa.verissimo.g@icloud.com"
      ) {
        return "🦊 Raposinha";
      }

      return email;
    }


    function formatTime(dateString) {

      try {

        return new Date(dateString)
          .toLocaleTimeString(
            "pt-BR",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          );

      } catch {

        return "";

      }
    }


    /* =========================================================
       ENVIAR MENSAGEM
       ========================================================= */

    async function sendMessage() {

      const text =
        input.value.trim();

      if (!text) return;

      if (!currentUser) {

        showLoginError(
          "Você precisa estar conectado."
        );

        return;

      }

      input.disabled = true;

      try {

        const {
          error
        } = await supabaseClient
          .from("messages")
          .insert({
            sender: currentUser.email,
            message: text
          });

        if (error) {
          throw error;
        }

        input.value = "";

      } catch (error) {

        console.error(
          "Erro ao enviar mensagem:",
          error
        );

        alert(
          "Não foi possível enviar a mensagem."
        );

      } finally {

        input.disabled = false;
        input.focus();

      }
    }


    /* =========================================================
       REALTIME
       ========================================================= */

    function subscribeToMessages() {

      if (realtimeChannel) {

        supabaseClient.removeChannel(
          realtimeChannel
        );

      }

      realtimeChannel =
        supabaseClient
          .channel("msn-messages")
          .on(
            "postgres_changes",
            {
              event: "INSERT",
              schema: "public",
              table: "messages"
            },
            payload => {

              const newMessage =
                payload.new;

              if (!newMessage) return;

              renderMessage(
                newMessage
              );

            }
          )
          .subscribe(
            status => {

              console.log(
                "Realtime:",
                status
              );

            }
          );
    }


    /* =========================================================
       EMOJIS
       ========================================================= */

    function addEmoji(emoji) {

      input.value += emoji;

      input.focus();

    }


    /* =========================================================
       NUDGE
       ========================================================= */

    function nudge() {

      messenger.classList.remove(
        "shake"
      );

      void messenger.offsetWidth;

      messenger.classList.add(
        "shake"
      );

      setTimeout(
        () => {

          messenger.classList.remove(
            "shake"
          );

        },
        1000
      );

    }


    /* =========================================================
       LOGOUT
       ========================================================= */

    async function logout() {

      try {

        await supabaseClient.auth.signOut();

      } catch (error) {

        console.error(
          "Erro ao sair:",
          error
        );

      }

    }


    /* =========================================================
       UTILITÁRIOS
       ========================================================= */

    function scrollChat() {

      requestAnimationFrame(
        () => {

          chat.scrollTop =
            chat.scrollHeight;

        }
      );

    }


    function escapeHTML(text) {

      const div =
        document.createElement("div");

      div.textContent =
        String(text ?? "");

      return div.innerHTML;

    }


    /* =========================================================
       ENTER NO LOGIN
       ========================================================= */

    passwordInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          login();

        }

      }
    );


    /* =========================================================
       START
       ========================================================= */

    checkSession();

  </script>
